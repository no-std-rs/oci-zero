name: Publish Runnerless Cargo release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable crate-vX.Y.Z release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish crate with OIDC
    if: github.repository == 'no-std-rs/oci-zero' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.95.0'
      - name: Verify immutable release and package
        id: package
        run: >-
          python3 tools/runnerless-cargo-publish.py package
          --repository no-std-rs/oci-zero --tag "$RELEASE_TAG"
          --crate gzip-zero --crate zstd-zero --crate oci-zero
      - name: Exchange GitHub OIDC identity
        if: steps.package.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish and reconcile immutable bytes
        if: steps.package.outputs.publish == 'true'
        env:
          RUNNERLESS_PUBLISH_DEADLINE: ${{ steps.package.outputs.deadline }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >-
          python3 tools/runnerless-cargo-publish.py publish
          --repository no-std-rs/oci-zero --tag "$RELEASE_TAG"
          --crate gzip-zero --crate zstd-zero --crate oci-zero
