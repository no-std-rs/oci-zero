name: Publish Runnerless release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable <crate>-vMAJOR.MINOR.PATCH release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish crate with OIDC
    if: github.repository == 'no-std-rs/oci-zero' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published release and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName > /tmp/release.json
          python3 - <<'PY'
          import json, os
          release = json.load(open('/tmp/release.json'))
          assert not release['isDraft'] and not release['isPrerelease'], 'stable published release required'
          assert release['tagName'] == os.environ['RELEASE_TAG'], 'release tag mismatch'
          PY
          git merge-base --is-ancestor HEAD origin/main
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          toolchain: stable
      - name: Prepare independent crate versions
        id: prepare
        run: python3 tools/prepare-release.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Verify distributable package
        run: cargo package --locked --allow-dirty -p '${{ steps.prepare.outputs.package }}'
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the selected crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --allow-dirty -p '${{ steps.prepare.outputs.package }}'
