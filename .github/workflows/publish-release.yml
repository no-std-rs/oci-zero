name: Prepare Cargo release for Runnerless
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable crate-vX.Y.Z release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: prepare-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare verified Cargo upload assets
    if: github.repository == 'no-std-rs/oci-zero' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Retain the preparation tools from this workflow revision
        run: |
          mkdir -p "$RUNNER_TEMP/runnerless-cargo-tools"
          cp tools/runnerless-cargo-publish.py tools/runnerless-cargo-capture.py "$RUNNER_TEMP/runnerless-cargo-tools/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.95.0'
      - name: Verify immutable release and package
        run: >-
          python3 "$RUNNER_TEMP/runnerless-cargo-tools/runnerless-cargo-publish.py" package
          --repository no-std-rs/oci-zero --tag "$RELEASE_TAG"
          --crate gzip-zero --crate zstd-zero --crate oci-zero
      - name: Capture the Cargo upload against a loopback registry
        run: >-
          python3 "$RUNNER_TEMP/runnerless-cargo-tools/runnerless-cargo-publish.py" capture
          --repository no-std-rs/oci-zero --tag "$RELEASE_TAG"
          --crate gzip-zero --crate zstd-zero --crate oci-zero
          --output "$RUNNER_TEMP/runnerless-cargo-assets"
      - name: Attach immutable assets for Runnerless
        run: >-
          python3 "$RUNNER_TEMP/runnerless-cargo-tools/runnerless-cargo-publish.py" attach
          --repository no-std-rs/oci-zero --tag "$RELEASE_TAG"
          --crate gzip-zero --crate zstd-zero --crate oci-zero
          --output "$RUNNER_TEMP/runnerless-cargo-assets"
