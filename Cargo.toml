[dependencies.base64ct]
default-features = false
version = "=1.6.0"

[dependencies.derive_more]
workspace = true

[dependencies.embedded-io]
default-features = false
optional = true
version = "0.7"

[dependencies.embedded-io-async]
default-features = false
optional = true
version = "0.7"

[dependencies.embedded-nal-async]
optional = true
version = "0.9"

[dependencies.gzip-zero]
optional = true
path = "gzip-zero"
version = "0.1.1"

[dependencies.mbedtls-rs]
default-features = false
features = ["tls"]
optional = true
version = "0.1"

[dependencies.reqwless]
default-features = false
optional = true
version = "0.14"

[dependencies.serde]
features = ["derive"]
optional = true
version = "1"

[dependencies.serde_json]
optional = true
version = "1"

[dependencies.sha2]
default-features = false
version = "0.10"

[dependencies.zstd-zero]
optional = true
path = "zstd-zero"
version = "0.2.1"

[dev-dependencies]
url = "=2.4.1"
zeroize = "=1.8.1"

[dev-dependencies.ureq]
default-features = false
features = ["tls"]
version = "=2.9.7"

[[example]]
name = "extract_file"
required-features = ["zstd"]

[[example]]
name = "download_metadata"
required-features = ["docker-credentials"]

[features]
default = []
docker-credentials = ["base64ct/alloc", "dep:serde", "dep:serde_json"]
gzip = ["dep:gzip-zero"]
reqwless = ["dep:embedded-io", "dep:embedded-io-async", "dep:embedded-nal-async", "dep:reqwless"]
tls = ["reqwless", "dep:mbedtls-rs"]
zstd = ["dep:zstd-zero"]

[package]
categories = ["no-std", "network-programming", "parser-implementations"]
description = "A no-std, allocation-free streaming core for OCI registries"
edition = "2021"
exclude = ["examples/esp32c3-ota"]
keywords = ["oci", "containers", "registry", "no-std", "streaming"]
license = "MIT OR Apache-2.0"
name = "oci-zero"
readme = "README.md"
repository = "https://github.com/pawelchcki/oci-zero"
rust-version = "1.75"
version = "0.3.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace]
exclude = ["examples/esp32c3-ota"]
members = ["gzip-zero", "no-std-extract", "tools/matter-qr", "web", "zstd-zero", "examples/registry-demo"]
resolver = "2"

[workspace.dependencies.derive_more]
default-features = false
features = ["display", "from"]
version = "1.0.0"
