api_version: ci-toolkit/v1alpha1

# The trusted Runnerless program owns reconciliation. This file supplies policy.
releases:
  uses: toolkit.release-please@v1
  tracks:
    oci-zero:
      strategy: cargo
      cargo_manifest: Cargo.toml
      cargo_manifests: [Cargo.toml, gzip-zero/Cargo.toml, no-std-extract/Cargo.toml, tools/matter-qr/Cargo.toml, web/Cargo.toml, zstd-zero/Cargo.toml, examples/registry-demo/Cargo.toml]
      release_commit_types: [feat, fix, perf]
      version_file: version.txt
      changelog_path: CHANGELOG.md
      tag_separator: "-"
      bump_minor_pre_major: true
      paths: ["**"]
      exclude:
        - version.txt
        - CHANGELOG.md
        - gzip-zero/version.txt
        - gzip-zero/CHANGELOG.md
        - zstd-zero/version.txt
        - zstd-zero/CHANGELOG.md
      changelog_sections:
        - {type: feat, section: Added, hidden: false}
        - {type: fix, section: Fixed, hidden: false}
        - {type: perf, section: Performance, hidden: false}
        - {type: docs, section: Documentation, hidden: false}
        - {type: refactor, section: Changed, hidden: false}
        - {type: test, section: Tests, hidden: true}
        - {type: ci, section: CI, hidden: true}
        - {type: build, section: Build, hidden: true}
        - {type: chore, section: Maintenance, hidden: true}
    gzip-zero:
      strategy: cargo
      cargo_manifest: gzip-zero/Cargo.toml
      cargo_manifests: [Cargo.toml, gzip-zero/Cargo.toml, no-std-extract/Cargo.toml, tools/matter-qr/Cargo.toml, web/Cargo.toml, zstd-zero/Cargo.toml, examples/registry-demo/Cargo.toml]
      release_commit_types: [feat, fix, perf]
      version_file: gzip-zero/version.txt
      changelog_path: gzip-zero/CHANGELOG.md
      tag_separator: "-"
      bump_minor_pre_major: true
      paths: ["gzip-zero/**"]
      exclude: ["gzip-zero/version.txt", "gzip-zero/CHANGELOG.md"]
      changelog_sections:
        - {type: feat, section: Added, hidden: false}
        - {type: fix, section: Fixed, hidden: false}
        - {type: perf, section: Performance, hidden: false}
        - {type: docs, section: Documentation, hidden: false}
        - {type: refactor, section: Changed, hidden: false}
        - {type: test, section: Tests, hidden: true}
        - {type: ci, section: CI, hidden: true}
        - {type: build, section: Build, hidden: true}
        - {type: chore, section: Maintenance, hidden: true}
    zstd-zero:
      strategy: cargo
      cargo_manifest: zstd-zero/Cargo.toml
      cargo_manifests: [Cargo.toml, gzip-zero/Cargo.toml, no-std-extract/Cargo.toml, tools/matter-qr/Cargo.toml, web/Cargo.toml, zstd-zero/Cargo.toml, examples/registry-demo/Cargo.toml]
      release_commit_types: [feat, fix, perf]
      version_file: zstd-zero/version.txt
      changelog_path: zstd-zero/CHANGELOG.md
      tag_separator: "-"
      bump_minor_pre_major: true
      paths: ["zstd-zero/**"]
      exclude: ["zstd-zero/version.txt", "zstd-zero/CHANGELOG.md"]
      changelog_sections:
        - {type: feat, section: Added, hidden: false}
        - {type: fix, section: Fixed, hidden: false}
        - {type: perf, section: Performance, hidden: false}
        - {type: docs, section: Documentation, hidden: false}
        - {type: refactor, section: Changed, hidden: false}
        - {type: test, section: Tests, hidden: true}
        - {type: ci, section: CI, hidden: true}
        - {type: build, section: Build, hidden: true}
        - {type: chore, section: Maintenance, hidden: true}
